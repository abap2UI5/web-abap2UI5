name: build_web

# No schedule, on purpose. Until 2026-10-06 a daily cron rebuilt the demo
# from the tip of abap2UI5 and samples, and every upstream commit that the
# transpiler or this pipeline did not cope with turned it red - the demo is
# frozen now (ci/pins.json, AGENTS.md "Frozen inputs"). It builds when this
# repository changes and when someone starts it by hand, and a build of the
# same commit reads the same inputs every time.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_web:
    # a fixed image rather than ubuntu-latest, for the same reason as
    # everything in ci/pins.json: the runner moving must not change the build
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # browser smoke needs the Chromium download on top of the build
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci

    # Chromium is ~130 MB and was downloaded on every single run - it is the
    # reason this job carries a 20 minute timeout. The key is the Playwright
    # version, because that is what decides which build is required.
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    # The samples at their pin (ci/pins.json). abap2UI5 itself is not cloned:
    # it is the npm package @abap2ui5/node-runtime, installed by `npm ci`.
    - run: npm run clone
    # `npm test` is the transpile (the package's framework sources and the
    # samples, ci/transpile.mjs) + the samples' transpiled unit tests. It is
    # spelled as the plain lifecycle script on purpose: what CI runs as "the
    # tests" and what a contributor runs locally have to be the same command.
    - run: npm test
    - run: npm run build:web
    # Browser smoke against the freshly built site (tests/web.spec.js via the
    # chromium-web project: backend boots in the browser, UI5 loads, the first
    # roundtrip answers). A blank page must never reach the deploy step —
    # before this gate the site deployed completely untested.
    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Smoke test the webpack build in a real browser
      run: npm run test:e2e
    # The site is published from this repository (GitHub Pages, source
    # "GitHub Actions"), so ./build is the whole page and nothing else: no
    # README or LICENSE has to travel with it, as they did while the deploy
    # went to the separate abap2UI5/web-abap2UI5-build repository. The 404
    # page is the one file the site needs beside the bundle.
    # Must run after webpack, which cleans ./build.
    - name: Add the 404 page to the deploy
      run: cp app/pages/404.html build/
    # What the deployed demo was built from, for a human who wants to know.
    # The sources are the framework package (its release commit and the two
    # library commits it records) and the pins in ci/pins.json, so this file
    # names exactly the commits and the UI5 release a rebuild of the same
    # commit reads.
    # (build-stamp.txt is gone: only the retired daily cron ever read it.)
    - name: Write build info
      run: |
        set -euo pipefail
        node -e '
          const pins = require("./ci/pins.json");
          const runtime = require("@abap2ui5/node-runtime/package.json");
          const sources = {
            "abap2UI5": "https://github.com/abap2UI5/abap2UI5/tree/" + runtime.abap2ui5.commit,
            "open-abap-core": "https://github.com/open-abap/open-abap-core/tree/" + runtime.abap2ui5.openAbapCore,
            "express-icf-shim": "https://github.com/open-abap/express-icf-shim/tree/" + runtime.abap2ui5.expressIcfShim,
            ...Object.fromEntries(Object.entries(pins.sources).map(([k, v]) => [k, v.url + "/tree/" + v.commit])),
          };
          sources["browser-demo"] = "https://github.com/abap2UI5/browser-demo/tree/" + process.env.GITHUB_SHA;
          require("fs").writeFileSync("build/BUILD_INFO.json", JSON.stringify({
            live_url: "https://abap2ui5.github.io/browser-demo/",
            built_at: new Date().toISOString(),
            built_by: "https://github.com/abap2UI5/browser-demo/actions/runs/" + process.env.GITHUB_RUN_ID,
            workflow: ".github/workflows/build_web.yaml",
            ui5: pins.ui5,
            "node-runtime": runtime.name + "@" + runtime.version,
            sources,
          }, null, 2) + "\n");
        '
    # Only main publishes. The guard on the repository keeps a fork's main
    # from trying to deploy a site it has no Pages for.
    - name: Upload the site
      if: github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/browser-demo'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./build

  # A job of its own so that only this one holds the Pages write and the OIDC
  # token, and only after unit tests and the browser smoke have passed. Until
  # 2026-11 this step pushed ./build with a deploy key (DEPLOY_WEB) into
  # abap2UI5/web-abap2UI5-build, a repository that existed only to be served;
  # that key is gone with it. Same action pins as abap2UI5/docs and
  # abap2UI5/browser-playground.
  deploy:
    needs: build_web
    if: github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/browser-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, and a running one is never cancelled - a Pages
    # deployment cut off halfway is worse than one that lands a minute late.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
