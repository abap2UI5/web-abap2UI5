name: build_web

# No schedule, on purpose. Until 2026-10-06 a daily cron rebuilt the demo
# from the tip of abap2UI5 and samples, and every upstream commit that the
# transpiler or this pipeline did not cope with turned it red - the demo is
# frozen now (ci/pins.json, AGENTS.md "Frozen inputs"). It builds when this
# repository changes and when someone starts it by hand, and a build of the
# same commit reads the same inputs every time.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_web:
    # a fixed image rather than ubuntu-latest, for the same reason as
    # everything in ci/pins.json: the runner moving must not change the build
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # browser smoke needs the Chromium download on top of the build
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci

    # Chromium is ~130 MB and was downloaded on every single run - it is the
    # reason this job carries a 20 minute timeout. The key is the Playwright
    # version, because that is what decides which build is required.
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - run: npm run clone
    # `npm test` is downport + transpile + the transpiled unit tests. It is
    # spelled as the plain lifecycle script on purpose: what CI runs as "the
    # tests" and what a contributor runs locally have to be the same command.
    - run: npm test
    - run: npm run build:web
    # Browser smoke against the freshly built site (tests/web.spec.js via the
    # chromium-web project: backend boots in the browser, UI5 loads, the first
    # roundtrip answers). A blank page must never reach the deploy step —
    # before this gate the site deployed completely untested.
    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Smoke test the webpack build in a real browser
      run: npm run test:e2e
    # The deploy is force_orphan, so the published repository is exactly what
    # ./build contains - a file committed there by hand is gone with the next
    # run. Everything a visitor should find (what this is, who built it, where
    # to report a bug, where the live page is) therefore ships from here.
    # Must run after webpack, which cleans ./build.
    - name: Add README, LICENSE and 404 page to the deploy
      run: |
        set -euo pipefail
        cp app/pages/README.md app/pages/404.html build/
        cp LICENSE build/
    # What the deployed demo was built from, for a human who wants to know.
    # The sources are the pins in ci/pins.json, so this file names exactly
    # the commits and the UI5 release a rebuild of the same commit reads.
    # (build-stamp.txt is gone: only the retired daily cron ever read it.)
    - name: Write build info
      run: |
        set -euo pipefail
        node -e '
          const pins = require("./ci/pins.json");
          const sources = Object.fromEntries(Object.entries(pins.sources).map(([k, v]) => [k, v.url + "/tree/" + v.commit]));
          sources["web-abap2UI5"] = "https://github.com/abap2UI5/web-abap2UI5/tree/" + process.env.GITHUB_SHA;
          require("fs").writeFileSync("build/BUILD_INFO.json", JSON.stringify({
            live_url: "https://abap2ui5.github.io/web-abap2UI5-build/",
            built_at: new Date().toISOString(),
            built_by: "https://github.com/abap2UI5/web-abap2UI5/actions/runs/" + process.env.GITHUB_RUN_ID,
            workflow: ".github/workflows/build_web.yaml",
            ui5: pins.ui5,
            sources,
          }, null, 2) + "\n");
        '
    # SHA-pinned like every other action here. This is the step that holds
    # DEPLOY_WEB and writes to the published repository, so it was the last
    # one that should have been tracking a mutable tag.
    #
    # The pin is the COMMIT, and the comment carries the full version. Both
    # halves were wrong until 2026-08-18 and each cost something:
    #
    #   refs/tags/v4        = 329bcc8f   <- what was pinned: a tag OBJECT
    #   refs/tags/v4^{}     = 84c30a85   <- the commit it dereferences to
    #   refs/tags/v4.1.0^{} = 84c30a85   <- the same commit, under a version
    #
    # A tag object is not what "SHA-pinned" means anywhere else in this file,
    # and a bare `# v4` is a version Dependabot cannot turn into an update
    # type - so this action fell out of the `actions` group and arrived as its
    # own pull request, which is the opposite of why the groups exist.
    - name: deploy to web-abap2UI5-build
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      if: github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/web-abap2UI5'
      with:
        deploy_key: ${{ secrets.DEPLOY_WEB }}
        external_repository: abap2UI5/web-abap2UI5-build
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        publish_branch: main
        force_orphan: true
        publish_dir: ./build
